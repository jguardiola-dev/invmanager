font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.041" x="339" y="179.2622">ni accede directamente a la BD.</text></g><g class="entity" data-entity="GMN12" data-source-line="36" data-uid="ent0013" id="entity_GMN12"><path d="M345,397.2969 L345,428.7969 L309.61,432.7969 L345,436.7969 L345,467.8281 A0,0 0 0 0 345,467.8281 L581.4839,467.8281 A0,0 0 0 0 581.4839,467.8281 L581.4839,407.2969 L571.4839,397.2969 L345,397.2969 A0,0 0 0 0 345,397.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M571.4839,397.2969 L571.4839,407.2969 L581.4839,407.2969 L571.4839,397.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.1538" x="351" y="414.3638">Centraliza validaciones de reglas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.4839" x="351" y="429.4966">de negocio y servicios auxiliares.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.792" x="351" y="444.6294">Los formularios delegan aqu&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.5269" x="351" y="459.7622">antes de persistir.</text></g><g class="entity" data-entity="GMN15" data-source-line="43" data-uid="ent0016" id="entity_GMN15"><path d="M398.5,639.2969 L398.5,670.7969 L363.04,674.7969 L398.5,678.7969 L398.5,709.8281 A0,0 0 0 0 398.5,709.8281 L679.5508,709.8281 A0,0 0 0 0 679.5508,709.8281 L679.5508,649.2969 L669.5508,639.2969 L398.5,639.2969 A0,0 0 0 0 398.5,639.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M669.5508,639.2969 L669.5508,649.2969 L679.5508,649.2969 L669.5508,639.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.3877" x="404.5" y="656.3638">Encapsula el acceso a BD mediante</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.0508" x="404.5" y="671.4966">el patr&#243;n DAO. Usa PreparedStatement,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.8848" x="404.5" y="686.6294">try-with-resources y transacciones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.5903" x="404.5" y="701.7622">JDBC cuando aplica.</text></g><!--link UI to LOGICA--><g class="link" data-entity-1="UI" data-entity-2="LOGICA" data-source-line="24" data-uid="lnk6" id="link_UI_LOGICA"><path d="M185,260.5769 C185,289.9969 185,315.4269 185,343.2269" fill="none" id="UI-to-LOGICA" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="185,349.2269,189,340.2269,185,344.2269,181,340.2269,185,349.2269" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.7559" x="186" y="302.4355">invoca validaciones</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="84.0586" x="202.8486" y="316.4043">y operaciones</text></g><!--link LOGICA to DATOS--><g class="link" data-entity-1="LOGICA" data-entity-2="DATOS" data-source-line="25" data-uid="lnk7" id="link_LOGICA_DATOS"><path d="M185,516.3869 C185,540.5269 185,560.9069 185,585.0469" fill="none" id="LOGICA-to-DATOS" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="185,591.0469,189,582.0469,185,586.0469,181,582.0469,185,591.0469" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.252" x="186" y="558.4355">delega persistencia</text></g><!--link DATOS to DB--><g class="link" data-entity-1="DATOS" data-entity-2="DB" data-source-line="26" data-uid="lnk8" id="link_DATOS_DB"><path d="M18